# Dry-Run Configuration for AdamW
model:
  vocab_size: 65536
  hidden_size: 1280
  num_hidden_layers: 24
  num_attention_heads: 10
  intermediate_size: 5120
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  kv_lora_rank: 320
  q_lora_rank: 960
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  mtp_depth: 1
  use_mtp: true

  init_std: 0.02
  z_loss_weight: 1.0e-4
  embed_scale: true

  # Output Logit Scaling / Temperature
  output_logit_scale: 1.0
  output_logit_scale_trainable: false

  tie_word_embeddings: true
  max_delta_history: 4

optimizer:
  type: "adamw"
  base_lr: 0.001
  warmup_steps: 50

  aurora:
    momentum: 0.8
    weight_decay: 0.05

  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.05
    eps: 1.0e-8

training:
  batch_size: 6
  gradient_accumulation_steps: 1
  seq_len: 2048 
  max_steps: 100
  gradient_clip: 1.0
  log_interval: 10
  seed: 42
  device: "auto"
