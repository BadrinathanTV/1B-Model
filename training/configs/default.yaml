# ═══════════════════════════════════════════════════════════════════════════════
# Optimized Configuration — ~1B SLM BF16
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   python training/train.py --config training/configs/default.yaml
# ─── Model Architecture ──────────────────────────────────────────────────────
model:
  vocab_size: 65536
  hidden_size: 1280              # Reduced from 2048 for 16GB VRAM budget
  num_hidden_layers: 24
  num_attention_heads: 10        # 1280 / 128 = 10 heads
  intermediate_size: 5120        # 4 * 1280
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  # MLA (Multi-Head Latent Attention) — scaled to new hidden_size
  kv_lora_rank: 320              # 0.25 * 1280
  q_lora_rank: 960               # 0.75 * 1280
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  # TST (Token Superposition Training)
  tst_group_size: 4
  tst_superposition_ratio: 0.2   # 20% of max_steps in superposition phase (paper: 20-40%)

  # MTP (Multi-Token Prediction)
  mtp_depth: 2
  use_mtp: true

  # Stability: Weight Initialization (DeepSeek-V3 uses 0.006; 1/√1280 ≈ 0.028)
  init_std: 0.02

  # Stability: Z-Loss regularization (PaLM/Gemma style)
  z_loss_weight: 1.0e-4

  # Stability: Embedding scaling by √hidden_size
  embed_scale: true

  # Stability: Output Head Scaling & Logit Temperature
  output_logit_scale: 1.0
  output_logit_scale_trainable: false

  # Weight Tying & Memory Optimizations
  tie_word_embeddings: true
  max_delta_history: 2
  gradient_checkpointing: true
  gradient_checkpointing_interval: 1

# ─── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  type: "sf_normuon"
  base_lr: 1.0 # ScheduleFree+ is learning-rate-free; base_lr defaults to 1.0
  warmup_steps: 1250 # c_warmup will automatically be 2500

  aurora:
    momentum: 0.95
    weight_decay: 0.05

  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.05 # Applied to Z_t, same as aurora
    eps: 1.0e-8

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 32 # The PROVEN config that achieved 26k TPS
  gradient_accumulation_steps: 64  # 32 * 64 = 2048
  seq_len: 1024
  max_steps: 5960
  mtp_loss_weight: 0.3
  mtp_loss_weight_final: 0.1         # Anneal to this after mtp_anneal_fraction of training
  mtp_anneal_fraction: 0.67          # DeepSeek-V3: anneal at 67% of total steps
  gradient_clip: 1.0
  log_interval: 1
  seed: 42
  device: "auto"
