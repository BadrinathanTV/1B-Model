# ═══════════════════════════════════════════════════════════════════════════════
# Optimized Configuration — ~1B SLM BF16
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   python training/train.py --config training/configs/default.yaml
# ─── Model Architecture ──────────────────────────────────────────────────────
model:
  vocab_size: 64000
  hidden_size: 1280              # Reduced from 2048 for 16GB VRAM budget
  num_hidden_layers: 24
  num_attention_heads: 10        # 1280 / 128 = 10 heads
  intermediate_size: 5120        # 4 * 1280
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  # MLA (Multi-Head Latent Attention) — scaled to new hidden_size
  kv_lora_rank: 320              # 0.25 * 1280
  q_lora_rank: 960               # 0.75 * 1280
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  # TST (Token Superposition Training)
  tst_group_size: 2

  # MTP (Multi-Token Prediction)
  mtp_depth: 2

  # Weight Tying & Memory Optimizations
  tie_word_embeddings: true
  max_delta_history: 8

# ─── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  type: "sf_normuon"
  base_lr: 0.01 # Polyak relies on a relatively large base LR
  warmup_steps: 1250 # c_warmup will automatically be 2500

  aurora:
    momentum: 0.95
    weight_decay: 0.05

  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.05 # Applied to Z_t, same as aurora
    eps: 1.0e-8

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 4 # per GPU
  gradient_accumulation_steps: 512
  seq_len: 2048 # (4 * 512 * 2048 = 4.19M tokens global batch size)
  max_steps: 50000
  mtp_loss_weight: 0.3
  gradient_clip: 1.0
  log_interval: 100
  seed: 42
  device: "auto"
