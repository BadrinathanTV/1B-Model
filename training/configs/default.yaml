# ═══════════════════════════════════════════════════════════════════════════════
# Optimized Configuration — ~1B SLM BF16
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   python training/train.py --config training/configs/default.yaml
# ─── Model Architecture ──────────────────────────────────────────────────────
model:
  vocab_size: 65536
  hidden_size: 1280              # Reduced from 2048 for 16GB VRAM budget
  num_hidden_layers: 28
  num_attention_heads: 10        # 1280 / 128 = 10 heads
  intermediate_size: 4096        # aligned to power of 2
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  # MLA (Multi-Head Latent Attention) — scaled to new hidden_size
  kv_lora_rank: 320              # 0.25 * 1280
  q_lora_rank: 960               # 0.75 * 1280
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  # MTP (Multi-Token Prediction)
  mtp_depth: 2                   # 1 = standard next-token prediction
  use_mtp: true

  # YaRN Context Extension
  use_yarn: false
  yarn_scale_factor: 1.0
  yarn_original_context: 512     # Match the new 512 pretraining seq_len
  yarn_beta_fast: 32.0
  yarn_beta_slow: 1.0

  # Stability: Weight Initialization (DeepSeek-V3 uses 0.006; 1/√1280 ≈ 0.028)
  init_std: 0.02

  # Stability: Z-Loss regularization (PaLM/Gemma style)
  z_loss_weight: 1.0e-4

  # Stability: Embedding scaling by √hidden_size
  embed_scale: true

  # Stability: Output Head Scaling & Logit Temperature
  output_logit_scale: 1.0
  output_logit_scale_trainable: false

  # Weight Tying & Memory Optimizations
  tie_word_embeddings: true
  max_delta_history: 2
  delta_block_size: 2
  gradient_checkpointing: true
  gradient_checkpointing_interval: 1

# ─── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  type: "hybrid"
  base_lr: 0.04
  warmup_steps: 1000

  aurora:
    momentum: 0.95
    weight_decay: 0.025
    use_riemannian: true
    update_clip: 0.1
    pp_iterations: 2
    pp_beta: 0.5

  adamw:
    lr_scale: 0.1 # Scales AdamW LR to 0.00375 (0.0375 * 0.1)
    betas: [0.9, 0.95]
    weight_decay: 0.025
    eps: 1.0e-6

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 32 # Safe batch size for 16GB VRAM (allows MTP to be toggled safely)
  gradient_accumulation_steps: 64  # 32 * 64 = 2048 effective batch size
  seq_len: 512
  max_steps: 47684 # 47,684 steps * 2048 bs * 512 seq_len = 50,000,000,000 tokens (50B tokens)
  gradient_clip: 1.0
  log_interval: 1
  seed: 42
  device: "auto"
