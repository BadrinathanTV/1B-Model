# ═══════════════════════════════════════════════════════════════════════════════
# Production Test Configuration — ~1B SLM BF16
# ═══════════════════════════════════════════════════════════════════════════════
model:
  vocab_size: 65536
  hidden_size: 1280
  num_hidden_layers: 24
  num_attention_heads: 10
  intermediate_size: 5120
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  # MLA
  kv_lora_rank: 320
  q_lora_rank: 960
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  # MTP
  mtp_depth: 2
  use_mtp: true

  # Stability
  init_std: 0.02
  z_loss_weight: 1.0e-4
  embed_scale: true
  output_logit_scale: 1.0
  output_logit_scale_trainable: false

  # Weight Tying & Memory
  tie_word_embeddings: true
  max_delta_history: 8
  gradient_checkpointing: true
  gradient_checkpointing_interval: 1

optimizer:
  type: "hybrid"
  base_lr: 1.0
  warmup_steps: 10

  aurora:
    momentum: 0.95
    weight_decay: 0.05

  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.05
    eps: 1.0e-8

training:
  batch_size: 16
  gradient_accumulation_steps: 2
  seq_len: 1024
  max_steps: 5
  gradient_clip: 1.0
  log_interval: 1
  seed: 42
  device: "auto"
