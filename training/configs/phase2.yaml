# ═══════════════════════════════════════════════════════════════════════════════
# Phase 2 Pretraining Config — 1B SLM BF16 (Long Context Induction)
# ═══════════════════════════════════════════════════════════════════════════════
# Usage: uv run training/train.py --config training/configs/phase2.yaml --data_dir data/phase2_corpus --resume_weights checkpoints/phase1_model/model.pt
model:
  vocab_size: 65536
  hidden_size: 1280
  num_hidden_layers: 28
  num_attention_heads: 10
  intermediate_size: 4096
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  kv_lora_rank: 320
  q_lora_rank: 960
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0

  mtp_depth: 2
  use_mtp: true

  use_yarn: true
  yarn_scale_factor: 4.0
  yarn_original_context: 512
  yarn_beta_fast: 32.0
  yarn_beta_slow: 1.0

  init_std: 0.02
  z_loss_weight: 1.0e-4
  embed_scale: true

  output_logit_scale: 1.0
  output_logit_scale_trainable: false

  tie_word_embeddings: true
  max_delta_history: 2
  delta_block_size: 2
  gradient_checkpointing: true
  gradient_checkpointing_interval: 1

optimizer:
  type: "hybrid"
  base_lr: 0.004
  warmup_steps: 100

  aurora:
    momentum: 0.95
    weight_decay: 0.025
    use_riemannian: true
    update_clip: 0.1
    pp_iterations: 2
    pp_beta: 0.5

  adamw:
    lr_scale: 0.1
    betas: [0.9, 0.95]
    weight_decay: 0.025
    eps: 1.0e-6

training:
  batch_size: 32
  gradient_accumulation_steps: 16
  seq_len: 2048
  max_steps: 6675  # 7 Billion Tokens
  gradient_clip: 1.0
  log_interval: 1
  seed: 42
  device: "auto"
