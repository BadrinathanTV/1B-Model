# ═══════════════════════════════════════════════════════════════════════════════
# Production Preset — 1B SLM on RTX 5080 (SM120) with NVFP4
# ═══════════════════════════════════════════════════════════════════════════════
# Inherits from default.yaml; only overrides what's different for full training.
# Usage:
#   python train.py --config configs/1b_nvfp4.yaml

# ─── Model Architecture ──────────────────────────────────────────────────────
model:
  vocab_size: 64000
  hidden_size: 2048
  num_hidden_layers: 24
  num_attention_heads: 16
  intermediate_size: 8192
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6
  kv_lora_rank: 512
  q_lora_rank: 1536
  qk_rope_head_dim: 64
  v_head_dim: 128
  rope_theta: 10000.0
  tst_group_size: 4         # Full 4x compression for production TST
  mtp_depth: 3              # Predict 2 auxiliary future tokens
  tie_word_embeddings: true
  max_delta_history: 0     # 0 means keep full history

# ─── Precision / NVFP4 ───────────────────────────────────────────────────────
precision:
  high_precision_start_layers: 2
  high_precision_end_layers: 4
  nvfp4_disable_rht: true
  nvfp4_disable_stochastic_rounding: true

# ─── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  type: "hybrid"
  base_lr: 3.0e-4

  aurora:
    momentum: 0.95
    weight_decay: 0.1
    nesterov: true
    use_riemannian: true

  adamw:
    lr_scale: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-10
    weight_decay: 0.1

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 4
  seq_len: 2048
  max_steps: 100000
  mtp_loss_weight: 0.3
  gradient_clip: 1.0
  log_interval: 50
  seed: 42
  device: "auto"
