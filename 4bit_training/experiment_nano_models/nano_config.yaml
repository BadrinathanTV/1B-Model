# ═══════════════════════════════════════════════════════════════════════════════
# Nano Configuration — 50M Parameters
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Model Architecture ──────────────────────────────────────────────────────
model:
  vocab_size: 64000
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-6

  # MLA (Multi-Head Latent Attention)
  kv_lora_rank: 96
  q_lora_rank: 288
  qk_rope_head_dim: 64
  v_head_dim: 64
  rope_theta: 10000.0

  # TST (Token Superposition Training)
  tst_group_size: 2

  # MTP (Multi-Token Prediction)
  mtp_depth: 2

  # Weight Tying & Memory Optimizations
  tie_word_embeddings: true
  max_delta_history: 0

# ─── Precision / NVFP4 ───────────────────────────────────────────────────────
precision:
  high_precision_start_layers: 2
  high_precision_end_layers: 4
  nvfp4_disable_rht: true
  nvfp4_disable_stochastic_rounding: true

# ─── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  type: "nf_aurora"                 # Will be overridden by CLI args
  base_lr: 0.02
  warmup_steps: 1000

  aurora:
    momentum: 0.95
    weight_decay: 0.025
    nesterov: true
    use_riemannian: false

  adamw:
    lr_scale: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-10
    weight_decay: 0.1

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 8
  seq_len: 512
  max_steps: 10                     # Default for dry run testing
  mtp_loss_weight: 0.3
  gradient_clip: 1.0
  log_interval: 1
  seed: 42
  device: "auto"
